<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EarthSense Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
    <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
    <div id="map"></div>
    <script>
        let map = L.map('map').setView([32.2, 35.6], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let marker = null;

        // Initialize QWebChannel correctly
        let bridgeReady = false;
        let pyjs = null;

        new QWebChannel(qt.webChannelTransport, function(channel) {
            pyjs = channel.objects.pyjs;
            bridgeReady = true;
            console.log("QWebChannel connected.");
        });

        // On map click
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;

            if (marker) map.removeLayer(marker);
            marker = L.marker(e.latlng).addTo(map);

            if (bridgeReady && pyjs) {
                pyjs.sendCoordinates(lat, lon);
                console.log("Sent to PyQt:", lat, lon);
            } else {
                console.log("Bridge not ready.");
            }
        });
    </script>
</body>
</html>
